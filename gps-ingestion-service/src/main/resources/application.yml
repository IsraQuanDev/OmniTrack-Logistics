server:
  port: 8082

spring:
  application:
    name: gps-ingestion-service
  main:
    web-application-type: reactive
  profiles:
    active: h2
  r2dbc:
    url: r2dbc:h2:mem:///gpsdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

# Spring Actuator configuration (Evaluation criteria #9)
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  endpoint:
    health:
      show-details: always

# Springdoc OpenAPI configuration (Evaluation criteria #8)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
